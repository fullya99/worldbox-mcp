name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-server:
    name: Lint server (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        working-directory: server
        run: uv sync --all-extras --frozen
      - name: ruff check
        working-directory: server
        run: uv run ruff check .
      - name: ruff format check
        working-directory: server
        run: uv run ruff format --check .
      - name: mypy
        working-directory: server
        run: uv run mypy --strict src
      - name: Lockfile matches pyproject
        # uv.lock records the project's own version, and `uv sync --frozen` does not
        # revalidate it, so the two drifted silently from 0.3.3 to 0.4.0 with CI green
        # throughout. release-please cannot own the file: its `generic` updater needs an
        # `x-release-please-version` annotation and `uv lock` rewrites the file whole,
        # dropping any comment. So the lockfile owns itself and this step keeps it honest.
        #
        # Skipped on release-please's branch, which bumps pyproject.toml and cannot run uv:
        # the lockfile is legitimately one version behind until the release lands. The next
        # ordinary PR fails here until someone runs `uv lock`, which is the point.
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        working-directory: server
        run: uv lock --check

  test-server:
    name: Test server (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Install
        working-directory: server
        run: uv sync --all-extras --frozen
      - name: Run unit + integration tests
        working-directory: server
        run: uv run pytest tests/unit tests/integration --cov=worldbox_mcp --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: server/coverage.xml
          fail_ci_if_error: false

  lint-mod:
    name: Lint mod (csharpier)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install csharpier
        # Pin to 0.x: csharpier 1.x (released 2025) changed the CLI (`dotnet csharpier --check`
        # -> `csharpier check`), removed XML registration as `dotnet-csharpier`, and shifted to
        # 4-space XML indentation by default. Reformatting the whole tree to 1.x defaults is a
        # deliberate decision -- track separately. For now pin to the last 0.x.
        run: dotnet tool install -g csharpier --version 0.30.6
      - name: Check formatting
        working-directory: mod
        run: dotnet csharpier --check .

  lint-workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        # Pinned by version and verified by content hash rather than pulling a third-party
        # action. This job exists to catch a mangled action ref (Cloudflare email
        # obfuscation rewrote a real one in this repo once), so it should not introduce one
        # of its own. The hash is the official checksum for the 1.7.7 linux_amd64 tarball.
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Lint
        # ubuntu-latest ships shellcheck, so actionlint also lints every `run:` block with
        # it. Both passes are clean on the four workflows today.
        run: ./actionlint -color

  build-mod:
    name: Build mod
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        working-directory: mod
        run: dotnet restore --locked-mode
      - name: Build (Release)
        working-directory: mod
        run: dotnet build --configuration Release --no-restore -warnaserror
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorldBoxBridge-dll
          path: mod/src/WorldBoxBridge/bin/Release/WorldBoxBridge.dll
          if-no-files-found: error

  test-mod:
    name: Test mod (xUnit)
    runs-on: windows-latest
    needs: build-mod
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        working-directory: mod
        run: dotnet restore --locked-mode
      - name: Test
        working-directory: mod
        run: dotnet test --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mod-test-results
          path: mod/**/TestResults/*.trx

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    needs: lint-server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.12
      - name: Install server
        working-directory: server
        run: uv sync --frozen
      - name: Self-check (server builds + tool schemas register cleanly)
        # The MCP Inspector CLI (v0.16+) requires --method <jsonrpc method>; calling it
        # without one now errors. The self-check is more direct and covers the same
        # ground: it constructs the FastMCP server, registers every tool, and exits 0
        # iff nothing throws during registration. CLAUDE.md "Day-to-day commands" uses
        # the same invocation as the dev sanity check.
        working-directory: server
        run: uv run worldbox-mcp --self-check --no-bridge-required
      - name: Docs match the registered tool surface
        # Fails when a count, an inventory table, the C#/Python command parity, the screenshot
        # defaults or the compatibility matrix row drifts. `--write` refreshes the generated
        # regions locally.
        #
        # On release-please's branch one check is dropped rather than all of them: that PR bumps
        # the four version files, and the matrix row for the new version is written by hand once
        # the release is actually out, so `--skip-release-version` turns off that check alone and
        # everything else keeps running. The next ordinary PR fails on it until the row is
        # written, which is how the matrix stops drifting a release behind.
        working-directory: server
        run: >-
          uv run --frozen python ../scripts/gen-docs.py --check
          ${{ startsWith(github.head_ref, 'release-please--') && '--skip-release-version' || '' }}

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
